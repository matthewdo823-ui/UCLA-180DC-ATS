name: Eligibility migration tests
on:
  pull_request:
    paths:
      - 'server/sql/add_screening_eligibility.sql'
      - 'server/test/eligibility/**'
      - '.github/workflows/eligibility.yml'
jobs:
  eligibility-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: eligibility_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify policy backfill, transfers, history and write guards
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/eligibility_test
        run: psql -X -v ON_ERROR_STOP=1 "$TEST_DATABASE_URL" -f server/test/eligibility/migration.sql
