name: Keep Render awake

# Render's free tier spins the service down after ~15 min of inactivity, and the
# next request then pays a ~30-60s cold boot. This pings the cheap /health endpoint
# every 10 minutes so the inactivity timer never elapses.
#
# Setup: add a repository variable RENDER_HEALTH_URL pointing at the health probe,
#   e.g. https://your-app.onrender.com/health
#   (Settings -> Secrets and variables -> Actions -> Variables -> New repository variable)
#
# Note: GitHub's scheduled runs are best-effort and can lag several minutes under load,
# so this keeps the service warm most of the time but is not a hard guarantee. For a
# firm guarantee use an external pinger (UptimeRobot / cron-job.org) or Render's paid tier.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_HEALTH_URL repository variable is not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 15 "$URL" && echo "  <- awake"
