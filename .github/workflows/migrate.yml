name: Database migrations

# Applying DDL to the production database is not reversible by re-running the job,
# so this workflow is deliberately narrow:
#   - it is manual-only; untrusted pull-request code never receives database access
#   - both plans and applies check out the trusted main branch
#   - the `production` environment gates the apply, so a required reviewer can be
#     configured in repo settings without touching this file
on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Show pending migrations without applying them'
        type: boolean
        default: true

# Never let two migration runs overlap. cancel-in-progress stays false: cancelling
# a run mid-apply is worse than queueing behind it.
concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !inputs.plan_only }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Show what will be applied
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate:plan --prefix server
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate --prefix server

  manual-plan:
    if: ${{ inputs.plan_only }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Plan pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate:plan --prefix server
