name: Database migrations

# Applying DDL to the production database is not reversible by re-running the job,
# so this workflow is deliberately narrow:
#   - pull requests get a read-only plan, never an apply
#   - applies happen only from main, only when sql/ actually changed
#   - the `production` environment gates the apply, so a required reviewer can be
#     configured in repo settings without touching this file
on:
  pull_request:
    paths:
      - 'server/sql/**'
      - 'server/scripts/apply-migrations.js'
      - '.github/workflows/migrate.yml'
  push:
    branches: [main]
    paths:
      - 'server/sql/**'
      - 'server/scripts/apply-migrations.js'
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Show pending migrations without applying them'
        type: boolean
        default: true

# Never let two migration runs overlap. cancel-in-progress stays false: cancelling
# a run mid-apply is worse than queueing behind it.
concurrency:
  group: database-migrations
  cancel-in-progress: false

jobs:
  plan:
    # Forked PRs get no secrets, so the plan would fail on a missing connection
    # string rather than tell anyone anything useful.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Every job reads SUPABASE_DB_URL from this one environment, so a password
    # rotation is a single secret update.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Plan pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate:plan --prefix server

  apply:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.plan_only)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Show what will be applied
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate:plan --prefix server
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate --prefix server

  manual-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.plan_only
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Plan pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate:plan --prefix server
