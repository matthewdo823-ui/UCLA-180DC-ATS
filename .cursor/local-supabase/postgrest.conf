# PostgREST config for the local Supabase-compatible dev API.
# Local, isolated dev database only — not a production credential.
db-uri = "postgres://authenticator:devpass@localhost:5432/resume_screener"
db-schemas = "public"
db-anon-role = "anon"

# Must match LOCAL_SUPABASE_JWT_SECRET used to mint the service_role key.
jwt-secret = "local-dev-postgrest-jwt-secret-0123456789abcdef"

server-host = "127.0.0.1"
server-port = 3001
db-pool = 10
